<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹿兒島天文館美食與住宿地圖</title>
    <!-- 引入 Tailwind CSS 進行網頁美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Leaflet 地圖套件 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        /* 自訂地圖數字標記樣式 */
        .custom-marker {
            color: white;
            font-weight: 700;
            border-radius: 50%;
            width: 30px !important;
            height: 30px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            border: 2.5px solid white;
            font-size: 14px;

        }
        .marker-food { background-color: #ef4444; } /* 紅色代表美食 */
        .marker-hotel { background-color: #3b82f6; } /* 藍色代表住宿 */
        
        .leaflet-container *:focus {
            outline: none;
        }
        /* 美化側邊欄捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen bg-gray-50 overflow-hidden">

    <!-- 左側邊欄：地點清單 -->
    <div class="w-full md:w-1/3 lg:w-1/4 h-2/5 md:h-full bg-white shadow-xl z-20 flex flex-col overflow-hidden relative">
        <div class="p-5 bg-gradient-to-r from-orange-600 to-red-500 text-white shadow-md flex-shrink-0">
            <h1 class="text-xl font-bold tracking-wider">鹿兒島天文館地圖</h1>
            <p class="text-sm opacity-90 mt-1">必吃黑豚美食與住宿精選</p>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="place-list">
            <!-- 清單項目由 JavaScript 動態生成 -->
        </div>
    </div>

    <!-- 右側：地圖容器 -->
    <div id="map" class="w-full md:w-2/3 lg:w-3/4 h-3/5 md:h-full z-10"></div>

    <!-- 引入 Leaflet 地圖套件 JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 【已更新】替換為料理特色描述，並使用最穩定的經緯度導航網址
        const places = [
            { 
                id: 1, 
                name: "とんかつ 丸一", 
                desc: "嚴選鹿兒島黑豚，厚度驚人且肉汁鮮甜的極致炸豬排，外皮酥脆完美鎖住肉汁。", 
                lat: 31.588556, 
                lng: 130.551972, 
                type: "food"
            },
            { 
                id: 2, 
                name: "あぢもり", 
                desc: "黑豚涮涮鍋創始店，以獨門特調高湯涮煮，不需沾醬就能品嚐黑豚最純粹的鮮甜柔嫩。", 
                lat: 31.589456, 
                lng: 130.555028, 
                type: "food"
            },
            { 
                id: 3, 
                name: "遊食豚彩 いちにぃさん", 
                desc: "特色蕎麥麵高湯搭配柚子胡椒的黑豚涮涮鍋，風味清爽解膩，收尾的蕎麥麵更是絕配。", 
                lat: 31.590176, 
                lng: 130.554694, 
                type: "food"
            },
            { 
                id: 4, 
                name: "鹿児島ラーメン 豚とろ", 
                desc: "採用珍貴豬頰肉製成入口即化的銷魂叉燒，湯頭濃郁卻不膩口，搭配滑順的中粗麵條。", 
                lat: 31.587852, 
                lng: 130.552220, 
                type: "food"
            },
            { 
                id: 5, 
                name: "こむらさき", 
                desc: "鹿兒島拉麵老字號，無添加大量豬脂的清爽特製白湯，搭配細麵與滿滿的高麗菜。", 
                lat: 31.590391, 
                lng: 130.555232, 
                type: "food"
            },
            { 
                id: 6, 
                name: "天文館 吾愛人 本店", 
                desc: "醇厚味噌熬煮的道地黑豚關東煮，以及新鮮「首折鯖魚」等地道鹿兒島鄉土料理。", 
                lat: 31.590799, 
                lng: 130.554865, 
                type: "food"
            },
            { 
                id: 7, 
                name: "天文館むじゃき 本店", 
                desc: "鹿兒島名物「白熊刨冰」發祥地，綿密剉冰淋上秘製牛奶糖漿，點綴豐富新鮮水果。", 
                lat: 31.589136, 
                lng: 130.555896, 
                type: "food"
            },
            { 
                id: 8, 
                name: "ホテル グランセレッソ", 
                desc: "您的住宿地點，交通便利的現代化飯店，為您的鹿兒島美食之旅提供舒適的休息空間。", 
                lat: 31.588075, 
                lng: 130.552601, 
                type: "hotel"
            }
        ];

        // 初始化地圖
        const map = L.map('map', {
            zoomControl: false 
        }).setView([31.5893, 130.5539], 16);

        // 將地圖放大縮小按鈕移到右下角
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 載入 OpenStreetMap 圖資
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19
        }).addTo(map);

        const markers = {};
        const listContainer = document.getElementById('place-list');

        // 自動生成地圖標記與左側卡片清單
        places.forEach(place => {
            const markerClass = place.type === 'hotel' ? 'marker-hotel' : 'marker-food';
            
            // 【終極修復】：使用最原始的 Google Maps 經緯度參數，保證所有裝置皆可開啟定位
            const gmapUrl = `https://www.google.com/maps?q=${place.lat},${place.lng}`;
            
            // 建立客製化數字圓圈圖示
            const customIcon = L.divIcon({
                className: '',
                html: `<div class="custom-marker ${markerClass}">${place.id}</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15]
            });

            // 在地圖上加上標記
            const markerOptions = { icon: customIcon };
            if (place.type === 'hotel') {
                markerOptions.zIndexOffset = 1000; 
            }
            const marker = L.marker([place.lat, place.lng], markerOptions).addTo(map);
            
            // 點擊標記時彈出的泡泡視窗內容
            const popupContent = `
                <div class="text-center p-1 min-w-[160px] max-w-[200px]">
                    <h3 class="font-bold text-gray-800 text-sm mb-1">${place.name}</h3>
                    <p class="text-xs text-gray-600 mb-3 leading-relaxed">${place.desc}</p>
                    <a href="${gmapUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-full px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 text-xs font-medium rounded transition-colors no-underline">
                        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
                        📍 開啟 Google Maps
                    </a>
                </div>
            `;
            marker.bindPopup(popupContent);
            markers[place.id] = marker;

            // 建立左側清單的卡片 HTML
            const listItem = document.createElement('div');
            listItem.className = 'p-3 bg-white border border-gray-100 rounded-lg shadow-sm cursor-pointer hover:bg-orange-50 hover:border-orange-200 transition-all duration-200 flex items-start space-x-4 transform hover:-translate-y-0.5';
            
            const badgeColor = place.type === 'hotel' ? 'bg-blue-500' : 'bg-red-500';
            
            listItem.innerHTML = `
                <div class="flex-shrink-0 w-8 h-8 rounded-full ${badgeColor} text-white flex items-center justify-center font-bold shadow-md mt-1">
                    ${place.id}
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-gray-800 text-sm md:text-base leading-tight">${place.name}</h3>
                    <p class="text-xs text-gray-500 mt-1 mb-2 leading-relaxed">${place.desc}</p>
                    <a href="${gmapUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="inline-flex items-center text-xs text-blue-500 hover:text-blue-700 font-medium">
                        <svg class="w-3.5 h-3.5 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
                        在 Google Maps 中開啟
                    </a>
                </div>
            `;

            // 點擊卡片時，地圖會滑動過去並自動打開泡泡
            listItem.onclick = () => {
                map.setView([place.lat, place.lng], 18, {
                    animate: true,
                    duration: 0.8
                });
                setTimeout(() => {
                    marker.openPopup();
                }, 300);
            };

            listContainer.appendChild(listItem);
        });
    </script>
</body>
</html>
